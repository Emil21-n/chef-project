# Keep Strapi's administration surface on the Chef's Choice domain without
# proxying the public /api namespace used by the Next.js checkout.
location ~ ^/(?:admin|content-manager|content-type-builder|content-releases|review-workflows|upload|uploads|i18n|users-permissions|email|audit-logs)(?:/|$) {
    client_max_body_size 25m;

    # A variable proxy target plus the local resolver avoids pinning a stale
    # Strapi Cloud address across DNS changes. The public host is not a secret.
    resolver 127.0.0.53 valid=300s ipv6=off;
    set $strapi_cloud_host sublime-delight-1a4de16cb4.strapiapp.com;

    proxy_pass https://$strapi_cloud_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $strapi_cloud_host;
    proxy_set_header Origin https://$strapi_cloud_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_ssl_server_name on;
    proxy_ssl_name $strapi_cloud_host;
    proxy_redirect https://sublime-delight-1a4de16cb4.strapiapp.com/ /;
    proxy_cookie_domain sublime-delight-1a4de16cb4.strapiapp.com chefschoice-turk.ru;
    proxy_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
