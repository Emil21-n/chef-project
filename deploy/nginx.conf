limit_req_zone $binary_remote_addr zone=chef_orders:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=chef_order_status:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chef_webhooks:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=chef_health:10m rate=10r/m;
limit_req_status 429;

upstream chef_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    server_name chefschoice-turk.ru www.chefschoice-turk.ru;

    if ($host = www.chefschoice-turk.ru) {
        return 301 https://chefschoice-turk.ru$request_uri;
    }

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/orders {
        limit_req zone=chef_orders burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://chef_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    location = /api/payments/yookassa/status {
        limit_req zone=chef_order_status burst=20 nodelay;
        proxy_pass http://chef_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    location = /api/payments/yookassa/webhook {
        limit_req zone=chef_webhooks burst=30 nodelay;
        client_max_body_size 32k;

        # Official YooKassa notification networks. Recheck this list against
        # https://yookassa.ru/developers/using-api/webhooks before deployment.
        allow 185.71.76.0/27;
        allow 185.71.77.0/27;
        allow 77.75.153.0/25;
        allow 77.75.156.11;
        allow 77.75.156.35;
        allow 77.75.154.128/25;
        allow 2a02:5180::/32;
        deny all;

        proxy_pass http://chef_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    location = /api/health {
        limit_req zone=chef_health burst=5 nodelay;
        proxy_pass http://chef_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    include /etc/nginx/snippets/chef-strapi-admin.conf;

    location / {
        proxy_pass http://chef_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/chefschoice-turk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefschoice-turk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name chefschoice-turk.ru www.chefschoice-turk.ru;
    server_tokens off;
    return 301 https://chefschoice-turk.ru$request_uri;
}
